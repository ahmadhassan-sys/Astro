  heading: An AI that writes the first draft. The expert reviews it, instead of starting from a blank page.
  body:
  - 'Construction Check is a platform for construction cost estimating. Before anyone can price a project, an estimator writes
    a Basis of Estimate: the document that sets out what’s included, what isn’t, and every assumption behind the numbers.
    Its AI reads a project’s drawings, specs and scopes and drafts that document for the estimator to review and finalize.
    Break Thirty designed, built and trained the AI, and the app around it.'
