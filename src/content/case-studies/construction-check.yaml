- type: how
  label: How we worked
  mods:
  - cz-how--en
  - cz-how--ck
  heading: Five steps, from old reports to a live app.
  steps:
  - title: Discovery
    text: Read 200+ past reports and sat with estimators to learn how they work today.
  - title: Standardize
    text: Turned 200+ different report styles into one master blueprint.
  - title: Train
    text: Trained the AI on real construction documents, so it understands the work, not just the words.
  - title: Review loop
    text: Built the step where the estimator checks, edits and approves every draft.
  - title: Launch
    text: Launched the app on Microsoft Azure, ready for real projects.
  headWide: true
- type: output
  label: The Work
  mods:
  - cz-out--ck
  headMods:
  - cz-out__head--ck
  heading: From messy archive to working AI.
  navLabel: The four steps
  tabsMods: []
  parts:
  - kicker: Step 1
    title: One shared foundation
    body:
    - 'Every past report was written differently: different sections, different wording, different levels of detail. We worked
      through 200+ of them and distilled them into one master blueprint. Every estimate now follows the same structure, and
      the AI has one clear pattern to learn from.'
    headMt: 32
    media:
    - wide:
        image: /assets/images/case-studies/construction-check/p1w.jpg
        alt: master blueprint
        h: 800
    tab: One shared foundation
  - kicker: Step 2
    title: Questions in, a drafted estimate out
    body:
    - The app starts each project with a few simple questions, like the type of building and where it is. Then the user uploads
      the drawings and documents, and the AI drafts the Basis of Estimate. Because we trained it on real construction work,
      it writes like an estimator would, not like a generic chatbot.
    headMt: 32
    media:
    - pair:
      - image: /assets/images/case-studies/construction-check/p3a.jpg
        alt: project questions
        h: 800
      - image: /assets/images/case-studies/construction-check/p3b.jpg
        alt: drafted estimate
        h: 800
    tab: Questions in, estimate out
  - kicker: Step 3
    title: The estimator stays in control
    body:
    - The AI drafts; the estimator decides. Every assumption and exclusion, meaning what the estimate does and doesn’t cover,
      is flagged for review, so nothing slips through. No more writing from scratch.
    headMt: 32
    media:
    - wide:
        image: /assets/images/case-studies/construction-check/p2a.jpg
        alt: review screen
        h: 800
    tab: The estimator stays in control
  - kicker: Step 4
    title: The app and the intelligence behind it
    body:
    - 'One web app, running on Microsoft Azure, handles the whole flow from first question to approved estimate. The clean,
      standardized data behind it also powers three AI tools: ConceptCheck, EstimateCheck and Agent Louie. The cleanup work
      is done once, and every tool benefits.'
    headMt: 32
    media:
    - pair:
      - image: /assets/images/case-studies/construction-check/x1.jpg
        alt: the app
        h: 800
      - image: /assets/images/case-studies/construction-check/x2.jpg
        alt: AI tools
        h: 800
    tab: The app and its AI tools
