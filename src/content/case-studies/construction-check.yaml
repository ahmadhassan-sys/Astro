- type: challenge
  label: The challenge
  heading: Skilled people are retiring, and the work is still done by hand.
  body:
  - Before pricing anything, an estimator reads every drawing, spec and scope, then writes the Basis of Estimate from scratch.
    On a large project, that alone takes days. Construction Check had 200+ past reports to learn from, but no two were built
    the same way. Years of expertise sat in documents that software couldn’t read, and that knowledge was leaving with every
    estimator who retired.
