    value: 76%+
    count: 76
    from: 69
    suffix: '%+'
  text: of online coupon codes don’t work. They’re expired, invalid or already used.
- type: how
  label: How we worked
  mods:
  - cz-how--en
  - cz-how--cc
  heading: Five stages, from the gap to the daily run.
  steps:
  - title: Discover
    text: 'Studied the coupon market and found the gap: shoppers needed more than a list of codes.'
  - title: Design
    text: A clean, simple experience where shoppers find the right code in seconds.
  - title: Build
    text: The site, the backend, the admin panel and the automations behind it.
  - title: Standardize
    text: Hired and trained the data team, and wrote the SOPs they follow every day.
  - title: Scale
    text: Daily operations, plus brand pages built to win search.
  headWide: true
- type: output
  label: The Work
  mods:
  - cz-out--cc
  headMods:
  - cz-out__head--cc
  heading: 'Five parts. One promise: The code works.'
  navLabel: The five parts
  tabsMods:
  - cz-tabs--5
  parts:
  - kicker: Part 1
    title: Finding a store
    body:
    - Shoppers arrive in two ways. Some already know the store and type its name into the search bar. Others browse, starting
      from a big category like Fashion and narrowing down until they reach the store they want. Either way, they land on the
      same page, with one simple web address per store.
    headMt: 32
    media:
    - wide:
        image: /assets/images/case-studies/coupon-chaser/p1w.jpg
        alt: finding a store
        h: 800
    tab: Finding a store
  - kicker: Part 2
    title: The brand page
    body:
    - 'Every store gets its own page, and this is where shoppers make up their minds. We laid it out in the order people actually
      think: the best code at the top, then other ways to save like sales and student discounts, then the practical stuff,
      such as returns and how to use a code at checkout.'
    headMt: 32
    media:
    - wide:
        image: /assets/images/case-studies/coupon-chaser/p2a.jpg
        alt: brand page
        h: 800
    tab: Brand page
  - kicker: Part 3
    title: Live code check
    body:
    - 'Most of us know the routine: copy a code, paste it at checkout, see “invalid,” try the next one. We built a checker
      into every brand page that tests the codes for you, in real time. One click, and each code is marked as working or not
      working.'
    headMt: 32
    media:
    - pair:
      - image: /assets/images/case-studies/coupon-chaser/p3a.jpg
        alt: checking codes
        h: 800
      - image: /assets/images/case-studies/coupon-chaser/p3b.jpg
        alt: code results
        h: 800
    tab: Live code check
  - kicker: Part 4
    title: The data team
    body:
    - Software alone can’t keep codes accurate, so there’s a team of real people behind it. Every day they look for new codes,
      test them by hand and remove the ones that have expired. They follow a written rulebook, so every code is handled the
      same way, no matter who checks it.
    headMt: 32
    media:
    - wide:
        image: /assets/images/case-studies/coupon-chaser/p2b.jpg
        alt: data team
        h: 800
    tab: Data team
  - kicker: Part 5
    title: Getting found on Google
    body:
    - 'Nobody types a coupon site’s address into their browser. They search Google for something like “Turo promo code.” SEO,
      short for search engine optimization, is the work that helps our pages show up near the top of those results. Every
      brand page is built to be the best answer: updated every month, easy to read and written by a real person.'
    headMt: 32
    media:
    - wide:
        image: /assets/images/case-studies/coupon-chaser/p3w.jpg
        alt: search results
        h: 800
    tab: SEO
- type: statement
  mods:
