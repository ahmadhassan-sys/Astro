- type: challenge
  label: The challenge
  heading: The code was the easy part.
  body:
  - 'Coupon sites list codes. Most of those codes are dead by the time a shopper finds them. The hard part is everything around
    the code: keeping it alive, showing whether the deal is any good, and explaining what happens after checkout.'
