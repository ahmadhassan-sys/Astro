- type: overview
  label: Project Overview
  heading: Coupon sites stop at the code. We built the rest of the stack.
  body:
  - The Coupon Chaser is a coupon site built from scratch. Shoppers get every way to save at a store, not just a code. Our
    data team finds and verifies codes by hand every day, and a live checker on every brand page shows shoppers which codes
    work right now. Break Thirty did all of it, from the first sketch to the daily run.
