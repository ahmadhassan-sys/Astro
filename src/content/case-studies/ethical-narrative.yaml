- type: brand
  label: The new brand
  heading: Kindness is power.
  body:
  - Ethical Narrative tells stories for organizations that build movements and shift culture, from health centers to policy
    institutes.
  - They asked for a brand as warm and as powerful as the work they make. We started with positioning and messaging, then
    rebuilt the logo, colour, type and website around it.
  image:
    image: /assets/images/case-studies/ethical-narrative/brand.jpg
    alt: the new brand
    mt: 104
  features:
  - title: The logo.
    body:
    - The N, drawn as one flowing line, like a story unfolding.
    - The N is drawn in a single, continuous stroke, the way a story moves from beginning to end. Rounded turns replace the
      heavy, hard-edged angles of the old mark, so it feels warm and kind while still standing upright and trusted. It holds
      up from a 16px favicon to a film title card, and repeats cleanly into the brand pattern.
    media:
    - wide:
        image: /assets/images/case-studies/ethical-narrative/logo.jpg
        alt: the logo
    - labels:
      - Before
      - After
    - pair:
      - image: /assets/images/case-studies/ethical-narrative/lb.png
        alt: old logo
      - image: /assets/images/case-studies/ethical-narrative/la.jpg
        alt: new logo
    - mono: The System
    - wide:
        image: /assets/images/case-studies/ethical-narrative/sys.jpg
        alt: the logo system
        mt: 64
  - title: Calm blues, warmed by magenta.
    body:
    - Dark Blue and Blue carry the steadiness that funders, partners and policymakers expect, and do most of the heavy lifting.
      Magenta and Coral bring the heart, setting Ethical Narrative apart from the cool, safe blues most non-profits use. Platinum,
      Spirit and Diamond keep layouts light, so the people and their stories stay in front.
    media:
    - wide:
        image: /assets/images/case-studies/ethical-narrative/col.jpg
        alt: the colour palette
        h: 720
  - title: A serif, a sans, and a human voice.
    body:
    - A warm serif for headlines, a clear sans for reading, and a script for signatures and personal notes.
    - Moisette gives headlines a confident, editorial voice that feels human rather than corporate. Public Sans keeps long
      reads, reports and the website easy to follow at any size. Dancing Script is used sparingly, for names, signatures and
      story titles, so it always feels personal.
    media:
    - wide:
        image: /assets/images/case-studies/ethical-narrative/type.jpg
        alt: typography
        h: 720
  - title: Built from the mark.
    body:
    - A small kit of shapes that make any page, post or sticker feel like Ethical Narrative.
    - Every element starts with the N, so even a texture or a badge reads as Ethical Narrative without the logo. The pattern
      adds texture, the badge works on stickers and avatars, ENSA fits tight spaces, and the sweep frames covers and dividers.
      Together they support the stories rather than compete with them.
    media:
    - pair:
      - image: /assets/images/case-studies/ethical-narrative/ma.jpg
        alt: pattern
      - image: /assets/images/case-studies/ethical-narrative/mb.jpg
        alt: badge
    - wide:
        image: /assets/images/case-studies/ethical-narrative/mw.jpg
        alt: graphic elements
        h: 720
        mt: 24
